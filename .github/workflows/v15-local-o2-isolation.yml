name: v1.5 Local O2 Isolation
# beat-aligned rerun

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-local-o2-isolation.yml'

permissions:
  contents: read

jobs:
  local-o2-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate local O2 isolation values
        run: node scripts/ursino-magosso-2000-local-o2-isolation.js
      - name: Local O2 isolation assertions
        run: node test/v15_ursino_magosso_2000_local_o2_isolation.test.js
      - name: Upload local O2 isolation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-o2-isolation
          path: ards-twin-v1.0/physician-audit-results/ursino-magosso-2000-local-o2-isolation.json
