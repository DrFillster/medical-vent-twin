name: v1.5 External Gas Audit

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-external-gas-audit.yml'

permissions:
  contents: read

jobs:
  external-gas-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: External gas trajectory matrix
        run: node test/v15_gas_external_validation_matrix.test.js
