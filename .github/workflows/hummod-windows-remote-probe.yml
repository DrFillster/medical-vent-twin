name: HumMod Windows Remote Probe

on:
  workflow_dispatch:
    inputs:
      attempt_remote_request:
        description: "Launch HumMod.EXE and submit the candidate remote request"
        required: true
        default: false
        type: boolean
      listener_file:
        description: "Listener target filename to use for the candidate request"
        required: true
        default: "BasicListener.DAT"
        type: string
      timeout_seconds:
        description: "Maximum seconds to wait for HumMod completion logfile"
        required: true
        default: "90"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Checkout Vent
        uses: actions/checkout@v4

      - name: Checkout pinned HumMod standalone
        uses: actions/checkout@v4
        with:
          repository: riliescu/hummod-standalone
          ref: 8dab57e05631f779bf5020fe0dd51874d8ae98c1
          path: hummod-standalone

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate candidate reference request
        working-directory: ards-twin-v0.5-progress
        run: node scripts/build-hummod-reference-remote-request.js

      - name: Run pinned HumMod reference request
        if: ${{ github.event_name == 'pull_request' || inputs.attempt_remote_request }}
        shell: pwsh
        env:
          PROBE_LISTENER: ${{ inputs.listener_file || 'BasicListener.DAT' }}
          PROBE_TIMEOUT: ${{ inputs.timeout_seconds || '120' }}
        run: |
          ./ards-twin-v0.5-progress/scripts/run-hummod-probe.ps1 `
            -HumModRoot ./hummod-standalone `
            -RequestPath ./ards-twin-v0.5-progress/hummod-runner/BasicListener.candidate.DAT `
            -OutputDirectory ./ards-twin-v0.5-progress/hummod-runner/runtime `
            -ListenerFile $env:PROBE_LISTENER -TimeoutSeconds ([int]$env:PROBE_TIMEOUT)

      - name: Upload HumMod probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummod-windows-remote-probe
          path: |
            ards-twin-v0.5-progress/hummod-runner/
          if-no-files-found: error

