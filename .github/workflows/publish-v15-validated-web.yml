name: Publish validated v1.5 web artifact

on:
  push:
    branches:
      - release/v15-publish-web-20261103
    paths:
      - '.github/workflows/publish-v15-validated-web.yml'

permissions:
  contents: write

concurrency:
  group: publish-v15-validated-web
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - name: Checkout active v1.5 source
        uses: actions/checkout@v4
        with:
          ref: v1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ards-twin-v1.0/package-lock.json
      - name: Capture source SHA
        run: echo "SOURCE_SHA=$(git -C .. rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build browser artifact
        run: npm run build
      - name: Verify deployable web
        run: npm run verify:deploy
      - name: Verify focused extremis harness
        run: node test/v13_extremis_chronotropy.test.js
      - name: Verify real browser parity
        run: node test/browser-extremis-parity.cjs
      - name: Stamp validated source
        run: printf '%s\n' "$SOURCE_SHA" > web/DEPLOY_SOURCE_SHA.txt
      - name: Verify publication scope
        run: |
          test "$(tr -d '\r\n' < web/DEPLOY_SOURCE_SHA.txt)" = "$SOURCE_SHA"
          grep -q 'Generated by npm run build. Version 1.5.0.' web/engine.js
          git -C .. status --porcelain | tee /tmp/v15-publish-status.txt
          if awk '{print $2}' /tmp/v15-publish-status.txt | grep -Ev '^ards-twin-v1\.0/web/' | grep -q .; then
            echo "Refusing publication: generated changes exist outside ards-twin-v1.0/web/."
            exit 1
          fi
      - name: Commit validated web artifact to v1.5
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add ards-twin-v1.0/web
          if git -C .. diff --cached --quiet; then
            echo "No web artifact changes to publish."
          else
            git -C .. commit -m "deploy(v1.5): validated web artifact $SOURCE_SHA"
            git -C .. push origin HEAD:v1.5
          fi
          echo "PUBLISHED_COMMIT=$(git -C .. rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publication summary
        run: |
          echo "source_sha=$SOURCE_SHA"
          echo "published_commit=$PUBLISHED_COMMIT"
          echo "marker=$(tr -d '\r\n' < web/DEPLOY_SOURCE_SHA.txt)"
