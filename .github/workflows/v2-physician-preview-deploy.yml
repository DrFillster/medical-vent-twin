name: v2.0 Physician Preview Deploy

on:
  push:
    branches: [v2.0]
    paths:
      - '.github/workflows/v2-physician-preview-deploy.yml'
      - 'ards-twin-v0.5-progress/web/**'
      - 'ards-twin-v0.5-progress/src/**'
      - 'ards-twin-v0.5-progress/test/v2_**'
      - 'ards-twin-v0.5-progress/test/clinical_twin_live_hummod_session.test.js'
      - 'ards-twin-v0.5-progress/package.json'

concurrency:
  group: v20-physician-preview-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ards-twin-v0.5-progress
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build browser bundle
        run: npm run build
      - name: v2.0 source autonomic controller
        run: node test/v2_source_autonomic_controller.test.js
      - name: v2.0 live patient regression
        run: node test/clinical_twin_live_hummod_session.test.js
      - name: Verify deployable web
        run: npm run verify:deploy
      - name: Verify v2.0 source controller is bundled
        run: |
          grep -q "createV2SourceAutonomicController" web/engine.js
          grep -q "v2.0 preview" web/index.html
      - name: Upload validated physician preview
        uses: actions/upload-artifact@v4
        with:
          name: v20-physician-static-web
          path: ards-twin-v0.5-progress/web/
          if-no-files-found: error
          retention-days: 7

  deploy-preview:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      preview_commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout served preview tree
        uses: actions/checkout@v4
        with:
          ref: v1.5
          fetch-depth: 0
      - name: Prepare isolated v2.0 physician preview
        run: |
          rm -rf ards-twin-v1.0/web/v2.0-preview
          mkdir -p ards-twin-v1.0/web/v2.0-preview
      - name: Download validated web
        uses: actions/download-artifact@v4
        with:
          name: v20-physician-static-web
          path: ards-twin-v1.0/web/v2.0-preview
      - name: Stamp source commit
        run: printf '%s\n' "${GITHUB_SHA}" > ards-twin-v1.0/web/v2.0-preview/DEPLOY_SOURCE_SHA.txt
      - name: Verify deployment isolation
        run: |
          test -f ards-twin-v1.0/web/v2.0-preview/index.html
          test -f ards-twin-v1.0/web/v2.0-preview/engine.js
          test -f ards-twin-v1.0/web/v2.0-preview/app.js
          test -f ards-twin-v1.0/web/v2.0-preview/clinical-worker.js
          test -f ards-twin-v1.0/web/v2.0-preview/DEPLOY_SOURCE_SHA.txt
          grep -q "v2.0 preview" ards-twin-v1.0/web/v2.0-preview/index.html
          grep -q "createV2SourceAutonomicController" ards-twin-v1.0/web/v2.0-preview/engine.js
          git status --porcelain --untracked-files=all | tee /tmp/status.txt
          if awk '{print $2}' /tmp/status.txt | grep -Ev '^(ards-twin-v1\.0/web/v2\.0-preview/)' | grep -q .; then
            echo "Refusing deployment: files outside isolated v2.0 preview changed."
            exit 1
          fi
      - name: Commit nested preview to served v1.5 branch
        id: commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ards-twin-v1.0/web/v2.0-preview
          if git diff --cached --quiet; then
            echo "No preview content change."
          else
            git commit -m "deploy(v2.0): physician preview ${SOURCE_SHA}"
            git push origin HEAD:v1.5
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  live-smoke:
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Verify live v2.0 physician preview
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASE: https://hummod.defying-logic.com/v2.0-preview
        run: |
          set -e
          mkdir -p smoke
          ok=0
          for attempt in $(seq 1 20); do
            index_code=$(curl -L -sS -o smoke/index.html -w '%{http_code}' --max-time 20 "$BASE/" || printf '000')
            source_code=$(curl -L -sS -o smoke/source.txt -w '%{http_code}' --max-time 20 "$BASE/DEPLOY_SOURCE_SHA.txt" || printf '000')
            live_sha=$(tr -d '\r\n' < smoke/source.txt 2>/dev/null || true)
            echo "attempt=$attempt index_code=$index_code source_code=$source_code live_sha=${live_sha:-missing} expected_sha=$SOURCE_SHA"
            if [ "$index_code" = "200" ] && [ "$source_code" = "200" ] && [ "$live_sha" = "$SOURCE_SHA" ] && grep -q "v2.0 preview" smoke/index.html; then
              ok=1
              break
            fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "v2.0 preview did not become live."
            exit 1
          fi
          for asset in app.js engine.js clinical-worker.js styles.css clinical-cases.json; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/$asset" || printf '000')
            test "$code" = "200"
          done
          echo "Live v2.0 physician preview verified at source $SOURCE_SHA."
