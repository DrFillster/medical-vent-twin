name: HumMod Native Solution Export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned upstream runtime and model
        uses: actions/checkout@v4
        with:
          repository: riliescu/hummod-standalone
          ref: 8dab57e05631f779bf5020fe0dd51874d8ae98c1
          path: hummod-standalone
      - name: Export native solution
        shell: powershell
        run: |
          ./ards-twin-v0.5-progress/scripts/export-hummod-native.ps1 `
            -HumModRoot ./hummod-standalone `
            -OutputDirectory ./hummod-native-output
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Convert native solution to Vent trajectory contracts
        run: node ards-twin-v0.5-progress/scripts/convert-hummod-native-solution.js hummod-native-output/Vent.SOLN hummod-native-output
      - name: Build native ventilation transport probe
        run: node ards-twin-v0.5-progress/scripts/mutate-hummod-native-solution.js hummod-native-output/Vent.SOLN ards-twin-v0.5-progress/hummod-runner/native-ventilation-probe.json hummod-native-output/Vent-probe-input.SOLN
      - name: Run native ventilation transport probe
        shell: powershell
        run: |
          ./ards-twin-v0.5-progress/scripts/export-hummod-native.ps1 `
            -HumModRoot ./hummod-standalone `
            -LoadSolution ./hummod-native-output/Vent-probe-input.SOLN `
            -OutputDirectory ./hummod-native-probe-output
      - name: Convert transport-probe output
        run: node ards-twin-v0.5-progress/scripts/convert-hummod-native-solution.js hummod-native-probe-output/Vent.SOLN hummod-native-probe-output ards-twin-v0.5-progress/hummod-runner/native-ventilation-probe.json
      - name: Upload native ventilation probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummod-native-ventilation-probe
          path: hummod-native-probe-output/
          if-no-files-found: error
      - name: Build pulmonary-injury sensitivity input
        run: node ards-twin-v0.5-progress/scripts/mutate-hummod-native-solution.js hummod-native-output/Vent.SOLN ards-twin-v0.5-progress/hummod-runner/native-pulmonary-injury-sensitivity-water.json hummod-native-output/Vent-pulmonary-injury-input.SOLN
      - name: Run pulmonary-injury sensitivity case
        shell: powershell
        run: |
          ./ards-twin-v0.5-progress/scripts/export-hummod-native.ps1 `
            -HumModRoot ./hummod-standalone `
            -LoadSolution ./hummod-native-output/Vent-pulmonary-injury-input.SOLN `
            -OutputDirectory ./hummod-native-pulmonary-injury-output
      - name: Convert pulmonary-injury sensitivity output
        run: node ards-twin-v0.5-progress/scripts/convert-hummod-native-solution.js hummod-native-pulmonary-injury-output/Vent.SOLN hummod-native-pulmonary-injury-output ards-twin-v0.5-progress/hummod-runner/native-pulmonary-injury-sensitivity-water.json
      - name: Compare pulmonary-injury trajectory with native baseline
        run: node ards-twin-v0.5-progress/scripts/compare-hummod-trajectories.js hummod-native-output/Vent.trajectory.json hummod-native-pulmonary-injury-output/Vent.trajectory.json hummod-native-pulmonary-injury-output/comparison.json
      - name: Upload pulmonary-injury sensitivity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummod-native-pulmonary-injury-sensitivity
          path: hummod-native-pulmonary-injury-output/
          if-no-files-found: error
      - name: Upload native output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummod-native-solution
          path: hummod-native-output/
          if-no-files-found: error
