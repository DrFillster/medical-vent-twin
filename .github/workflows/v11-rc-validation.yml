name: v1.1 RC Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'ards-twin-v1.0/**'
      - '.github/workflows/v11-rc-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rc-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ards-twin-v1.0/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit and regression tests
        run: npm test
      - name: Verify deployable web
        run: npm run verify:deploy
      - name: Verify v1.1 release-candidate gates
        run: npm run verify:v1.1-rc
      - name: Upload built RC web
        uses: actions/upload-artifact@v4
        with:
          name: validation-static-web
          path: ards-twin-v1.0/web/
          if-no-files-found: error
      - name: Publish preview branch
        if: github.head_ref == 'v1.1-rc1'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin publish-v1.1-rc1-preview
          rm -rf /tmp/v11-preview
          git worktree add /tmp/v11-preview origin/publish-v1.1-rc1-preview
          rm -rf /tmp/v11-preview/ards-twin-v1.1-rc1
          mkdir -p /tmp/v11-preview/ards-twin-v1.1-rc1/web
          cp -a web/. /tmp/v11-preview/ards-twin-v1.1-rc1/web/
          printf '%s\n' "$GITHUB_SHA" > /tmp/v11-preview/ards-twin-v1.1-rc1/PREVIEW_SOURCE_COMMIT.txt
          cd /tmp/v11-preview
          git add ards-twin-v1.1-rc1
          if git diff --cached --quiet; then
            echo "Preview bundle already current."
          else
            git commit -m "preview: publish validated v1.1 RC1 web bundle"
            git push origin HEAD:publish-v1.1-rc1-preview
          fi

  browser-smoke:
    needs: rc-gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Browser smoke
        env:
          BROWSER: chromium
        run: npm run test:browser
