name: v1.5 Basal Effector Mean Closure
# harness-fix rerun

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-basal-effector-mean-closure.yml'

permissions:
  contents: read

jobs:
  basal-effector:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate basal effector mean closure
        run: node scripts/ursino-magosso-2000-basal-effector-mean-closure.js
      - name: Basal effector mean closure assertions
        run: node test/v15_ursino_magosso_2000_basal_effector_mean_closure.test.js
      - name: Upload basal effector audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basal-effector-mean-closure
          path: ards-twin-v1.0/physician-audit-results/ursino-magosso-2000-basal-effector-mean-closure.json
