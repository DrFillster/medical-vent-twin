name: ARDS Twin Tests

on:
  push:
    branches:
      - main
      - feature/berlin-virtual-patients
    paths:
      - 'ards-twin-v0.4.5/**'
      - '.github/workflows/ards-twin-tests.yml'
  pull_request:
    paths:
      - 'ards-twin-v0.4.5/**'
      - '.github/workflows/ards-twin-tests.yml'

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ards-twin-v0.4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build browser bundle
        run: npm run build
      - name: Run unit and regression tests
        run: npm test
