name: ARDS Twin Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - feature/berlin-virtual-patients
      - 'integration/**'
    paths:
      - 'ards-twin-v0.5-progress/**'
      - 'ards-twin-v0.4.5/**'
      - '.github/workflows/ards-twin-tests.yml'
  pull_request:
    paths:
      - 'ards-twin-v0.5-progress/**'
      - 'ards-twin-v0.4.5/**'
      - '.github/workflows/ards-twin-tests.yml'

jobs:
  # Preview (canonical v0.5 development) — moved from ards-twin-v0.4.5 to ards-twin-v0.5-progress
  node-tests-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ards-twin-v0.5-progress
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build browser bundle
        run: npm run build
      - name: Run unit and regression tests
        run: npm test
      - name: Generate reference-case engineering benchmark
        continue-on-error: true
        run: npm run benchmark:reference
      - name: Generate live core PEEP target benchmark
        run: npm run benchmark:live-core-target
      - name: Upload live core target benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-core-peep-target
          path: ards-twin-v0.5-progress/benchmark-results/live-core-peep-target.json
          if-no-files-found: ignore
      - name: Generate cardiopulmonary PEEP target benchmark
        continue-on-error: true
        run: npm run benchmark:cardiopulmonary-target
      - name: Upload cardiopulmonary target benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cardiopulmonary-peep-target
          path: ards-twin-v0.5-progress/benchmark-results/live-cardiopulmonary-peep-target.json
          if-no-files-found: ignore
      - name: Generate recruitability phenotype challenge
        continue-on-error: true
        run: npm run benchmark:recruitability-challenge
      - name: Upload recruitability phenotype challenge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruitability-phenotype-challenge
          path: ards-twin-v0.5-progress/benchmark-results/recruitability-phenotype-challenge.json
          if-no-files-found: ignore
      - name: Upload reference-case benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-case-engineering-benchmark
          path: ards-twin-v0.5-progress/benchmark-results/reference-case-mechanics.json
          if-no-files-found: ignore
      - name: Report generated browser artifact drift
        run: |
          git diff --stat -- web/engine.js web/clinical-cases.json || true
          echo "Browser artifacts are built and uploaded by CI; CI does not write back to the branch."
      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: ards-twin-browser-build
          path: |
            ards-twin-v0.5-progress/web/engine.js
            ards-twin-v0.5-progress/web/clinical-cases.json
      - name: Stage deployment handoff
        shell: bash
        run: |
          rm -rf ../handoff-staging
          mkdir -p ../handoff-staging/ards-twin-v0.5-progress
          rsync -a ./ ../handoff-staging/ards-twin-v0.5-progress/ \
            --exclude node_modules \
            --exclude browser-results \
            --exclude benchmark-results
          printf '%s\n' "${GITHUB_SHA}" > ../handoff-staging/PACKAGE_COMMIT.txt
      - name: Upload deployment handoff ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vent-clinical-twin-progress
          path: handoff-staging
          if-no-files-found: error

  # Browser smoke for the preview (Chromium and WebKit)
  browser-smoke-preview:
    needs: node-tests-preview
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    defaults:
      run:
        working-directory: ards-twin-v0.5-progress
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser-test dependency
        run: npm install --no-package-lock
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build browser assets
        run: npm run build
      - name: Run browser smoke
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm run test:browser
      - name: Upload browser smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-preview-${{ matrix.browser }}
          path: ards-twin-v0.5-progress/browser-results/
          if-no-files-found: ignore

  # HumMod ARDS core analysis (depends on preview source)
  hummod-core-analysis-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ards-twin-v0.5-progress
    steps:
      - name: Checkout Vent
        uses: actions/checkout@v4
      - name: Checkout pinned HumMod
        uses: actions/checkout@v4
        with:
          repository: riliescu/hummod-standalone
          ref: 8dab57e05631f779bf5020fe0dd51874d8ae98c1
          path: hummod-standalone
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build HumMod ARDS dependency closure
        run: |
          node scripts/build-hummod-ards-core-graph.js \
            --hummod-root ../hummod-standalone \
            --out hummod-ards-core-analysis/dependency-graph.json
      - name: Summarize HumMod ARDS dependency closure
        run: |
          node -e "const g=require('./hummod-ards-core-analysis/dependency-graph.json'); console.log(JSON.stringify({fullClosure:g.fullClosure.structureCount,phase1Closure:g.phase1Closure.structureCount,frontierCount:g.phase1Closure.frontierCount,frontier:g.phase1Closure.frontier,missing:g.phase1Closure.missingStructures,systems:g.phase1Closure.systems},null,2))"
      - name: Upload HumMod ARDS core analysis
        uses: actions/upload-artifact@v4
        with:
          name: hummod-ards-core-analysis
          path: ards-twin-v0.5-progress/hummod-ards-core-analysis/dependency-graph.json
          if-no-files-found: error


  # Full upstream HumMod executable probe on Windows.
  # This is intentionally a merge gate while PR #3 is draft: the reduced
  # browser core should not be broadened until the pinned HumMod runtime can
  # produce a reproducible reference trajectory.
  hummod-windows-reference-probe:
    needs: node-tests-preview
    runs-on: windows-latest
    steps:
      - name: Checkout Vent
        uses: actions/checkout@v4

      - name: Checkout pinned HumMod standalone
        uses: actions/checkout@v4
        with:
          repository: riliescu/hummod-standalone
          ref: 8dab57e05631f779bf5020fe0dd51874d8ae98c1
          path: hummod-standalone

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate reference remote request
        working-directory: ards-twin-v0.5-progress
        run: node scripts/build-hummod-reference-remote-request.js

      - name: Bootstrap documented BasicListener
        shell: pwsh
        run: |
          $control = Join-Path $PWD "hummod-standalone/Control/Control.DES"
          $text = Get-Content $control -Raw
          $bootstrap = @"
          <remote>
            <openlistener>
              <name> BasicListener </name>
              <filename> BasicListener.DAT </filename>
              <interval> 1 </interval>
            </openlistener>
          </remote>
          "@
          if ($text -notmatch '<openlistener>') {
            $text = $text -replace '</control>', ($bootstrap + [Environment]::NewLine + '</control>')
            Set-Content -Path $control -Value $text -Encoding ascii
          }
          if ((Get-Content $control -Raw) -notmatch '<openlistener>') {
            throw "Documented BasicListener bootstrap was not injected."
          }

      - name: Run pinned HumMod reference request
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $PWD
          $hm = Join-Path $root "hummod-standalone"
          $exe = Join-Path $hm "HumMod.EXE"
          $candidate = Join-Path $root "ards-twin-v0.5-progress/hummod-runner/BasicListener.candidate.DAT"
          $runtimeOut = Join-Path $root "ards-twin-v0.5-progress/hummod-runner/runtime"
          New-Item -ItemType Directory -Force -Path $runtimeOut | Out-Null

          $status = [ordered]@{
            attempted = $true
            listenerFile = "BasicListener.DAT"
            listenerBootstrapInjected = $true
            processStarted = $false
            completionLogObserved = $false
            outputFileObserved = $false
            runtimeVerified = $false
          }

          $proc = $null
          try {
            $hash = Get-FileHash $exe -Algorithm SHA256
            [ordered]@{
              sha256 = $hash.Hash
              lengthBytes = (Get-Item $exe).Length
              pinnedRevision = "8dab57e05631f779bf5020fe0dd51874d8ae98c1"
            } | ConvertTo-Json | Set-Content (Join-Path $runtimeOut "executable-verification.json")

            $proc = Start-Process -FilePath $exe -WorkingDirectory $hm -PassThru
            $status.processStarted = $true
            Start-Sleep -Seconds 8

            if ($proc.HasExited) {
              $status.processExitedEarly = $true
              $status.processExitCode = $proc.ExitCode
            }

            Copy-Item $candidate (Join-Path $hm "BasicListener.DAT") -Force
            $deadline = (Get-Date).AddSeconds(120)
            $log = Join-Path $hm "VentHumMod-done.log"
            $out = Join-Path $hm "VentHumMod-output.txt"

            while ((Get-Date) -lt $deadline) {
              if (Test-Path $log) {
                $status.completionLogObserved = $true
                Copy-Item $log (Join-Path $runtimeOut "VentHumMod-done.log") -Force
                if (Test-Path $out) {
                  $status.outputFileObserved = $true
                  Copy-Item $out (Join-Path $runtimeOut "VentHumMod-output.txt") -Force
                }
                break
              }
              Start-Sleep -Seconds 2
            }

            $status.listenerRequestStillPresent = Test-Path (Join-Path $hm "BasicListener.DAT")
            if ($status.completionLogObserved -and $status.outputFileObserved) {
              $status.runtimeVerified = $true
            }
          }
          finally {
            Get-ChildItem -Path $hm -Force |
              Select-Object Name,Length,LastWriteTime,Attributes |
              ConvertTo-Json | Set-Content (Join-Path $runtimeOut "standalone-root-after.json")
            Get-ChildItem -Path $hm -Recurse -File -Include *.INI,*.ini,*.DAT,*.dat,*.XML,*.xml,*.log,*.txt |
              Select-Object FullName,Length,LastWriteTime |
              ConvertTo-Json | Set-Content (Join-Path $runtimeOut "runtime-files-after.json")
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            $status | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $runtimeOut "probe-status.json")
          }

          if (-not $status.runtimeVerified) {
            throw "Pinned HumMod runtime did not produce the requested completion log and tracked output."
          }

      - name: Upload full HumMod probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummod-windows-reference-probe
          path: ards-twin-v0.5-progress/hummod-runner/
          if-no-files-found: error

  # Legacy v0.4.5 mobile release regression — kept byte-for-byte against main baseline
  node-tests-legacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ards-twin-v0.4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build browser bundle
        run: node scripts/build.js
      - name: Run unit and regression tests
        run: node test/runner.js
      - name: Verify legacy tree unchanged from main baseline
        run: |
          git fetch origin main
          git diff --exit-code origin/main -- ards-twin-v0.4.5
          echo "Legacy v0.4.5 is byte-for-byte identical to origin/main"
