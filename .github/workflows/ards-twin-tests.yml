name: ARDS Twin Tests

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - feature/berlin-virtual-patients
    paths:
      - 'ards-twin-v0.4.5/**'
      - '.github/workflows/ards-twin-tests.yml'
  pull_request:
    paths:
      - 'ards-twin-v0.4.5/**'
      - '.github/workflows/ards-twin-tests.yml'

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ards-twin-v0.4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build browser bundle
        run: npm run build
      - name: Run unit and regression tests
        run: npm test
      - name: Commit generated browser artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/berlin-virtual-patients'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/engine.js web/clinical-cases.json
          if git diff --cached --quiet; then
            echo "Generated browser artifacts already current."
          else
            git commit -m "build: refresh generated browser artifacts [skip ci]"
            git push origin HEAD:feature/berlin-virtual-patients
          fi
      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: ards-twin-browser-build
          path: |
            ards-twin-v0.4.5/web/engine.js
            ards-twin-v0.4.5/web/clinical-cases.json
