name: ARDS Twin Tests

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - feature/berlin-virtual-patients
    paths:
      - 'ards-twin-v0.4.5/**'
      - '.github/workflows/ards-twin-tests.yml'
  pull_request:
    paths:
      - 'ards-twin-v0.4.5/**'
      - '.github/workflows/ards-twin-tests.yml'

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ards-twin-v0.4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build browser bundle
        run: npm run build
      - name: Run unit and regression tests
        run: npm test
      - name: Generate reference-case engineering benchmark
        continue-on-error: true
        run: npm run benchmark:reference
      - name: Generate live core PEEP target benchmark
        continue-on-error: true
        run: npm run benchmark:live-core-target
      - name: Upload live core target benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-core-peep-target
          path: ards-twin-v0.4.5/benchmark-results/live-core-peep-target.json
          if-no-files-found: ignore
      - name: Upload reference-case benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-case-engineering-benchmark
          path: ards-twin-v0.4.5/benchmark-results/reference-case-mechanics.json
          if-no-files-found: ignore
      - name: Commit generated browser artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/berlin-virtual-patients'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/engine.js web/clinical-cases.json
          if git diff --cached --quiet; then
            echo "Generated browser artifacts already current."
          else
            git commit -m "build: refresh generated browser artifacts [skip ci]"
            git push origin HEAD:feature/berlin-virtual-patients
          fi
      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: ards-twin-browser-build
          path: |
            ards-twin-v0.4.5/web/engine.js
            ards-twin-v0.4.5/web/clinical-cases.json
      - name: Stage deployment handoff
        shell: bash
        run: |
          rm -rf ../handoff-staging
          mkdir -p ../handoff-staging/ards-twin-v0.4.5
          rsync -a ./ ../handoff-staging/ards-twin-v0.4.5/ \
            --exclude node_modules \
            --exclude browser-results \
            --exclude benchmark-results
          printf '%s\n' "${GITHUB_SHA}" > ../handoff-staging/PACKAGE_COMMIT.txt
      - name: Upload deployment handoff ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vent-clinical-twin-progress
          path: handoff-staging
          if-no-files-found: error

  browser-smoke:
    needs: node-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    defaults:
      run:
        working-directory: ards-twin-v0.4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser-test dependency
        run: npm install --no-package-lock
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build browser assets
        run: npm run build
      - name: Run browser smoke
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm run test:browser
      - name: Upload browser smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ matrix.browser }}
          path: ards-twin-v0.4.5/browser-results/
          if-no-files-found: ignore

  hummod-core-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ards-twin-v0.4.5
    steps:
      - name: Checkout Vent
        uses: actions/checkout@v4
      - name: Checkout pinned HumMod
        uses: actions/checkout@v4
        with:
          repository: riliescu/hummod-standalone
          ref: 8dab57e05631f779bf5020fe0dd51874d8ae98c1
          path: hummod-standalone
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build HumMod ARDS dependency closure
        run: |
          node scripts/build-hummod-ards-core-graph.js \
            --hummod-root ../hummod-standalone \
            --out hummod-ards-core-analysis/dependency-graph.json
      - name: Summarize HumMod ARDS dependency closure
        run: |
          node -e "const g=require('./hummod-ards-core-analysis/dependency-graph.json'); console.log(JSON.stringify({fullClosure:g.fullClosure.structureCount,phase1Closure:g.phase1Closure.structureCount,frontierCount:g.phase1Closure.frontierCount,frontier:g.phase1Closure.frontier,missing:g.phase1Closure.missingStructures,systems:g.phase1Closure.systems},null,2))"
      - name: Upload HumMod ARDS core analysis
        uses: actions/upload-artifact@v4
        with:
          name: hummod-ards-core-analysis
          path: ards-twin-v0.4.5/hummod-ards-core-analysis/dependency-graph.json
          if-no-files-found: error
