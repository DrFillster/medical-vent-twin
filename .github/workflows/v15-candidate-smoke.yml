name: v1.5 Candidate Smoke
# smoke revision 4: rerun after source-delay and ownership fixes
# hypoxia-source-completion revision 4

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-candidate-smoke.yml'

permissions:
  contents: read

jobs:
  candidate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Severinghaus standard ODC candidate
        run: node test/v15_severinghaus_1979_standard_odc_candidate.test.js
      - name: Gas-autonomic promotion parity
        run: node test/v15_gas_autonomic_candidate_promotion_parity.test.js
      - name: Gas-cardiovascular perturbation gate
        run: node test/v15_gas_cardiovascular_candidate.test.js
      - name: Gas-cardiovascular recovery and convergence
        run: node test/v15_gas_cardiovascular_recovery_convergence.test.js
      - name: 2000 split effector runtime
        run: node test/v15_ursino_magosso_2000_split_effectors_runtime.test.js
      - name: 2000 expanded plant runtime
        run: node test/v15_ursino_magosso_2000_expanded_plant_runtime.test.js
      - name: 2000 local O2 candidate
        run: node test/v15_ursino_magosso_2000_local_o2_candidate.test.js
      - name: 2000 expanded hypoxia closed loop
        run: node test/v15_ursino_magosso_2000_expanded_hypoxia_closed_loop.test.js
      - name: Source hypoxia tidal-volume candidate
        run: node test/v15_ursino_magosso_2000_tidal_volume_candidate.test.js
      - name: Source deep-hypoxia time-course gate
        run: node test/v15_ursino_magosso_2000_deep_hypoxia_timecourse.test.js
      - name: External gas trajectory gate
        run: node test/v15_gas_external_validation_matrix.test.js
      - name: Houssiere 2005 hypoxia validation
        run: node test/v15_houssiere_2005_hypoxia_validation.test.js
      - name: Human autonomic validation smoke
        run: node test/v15_human_autonomic_validation_smoke.test.js
      - name: Ursino Fig9 sensitivity gate
        run: node test/v15_ursino_1998_fig9_sensitivity.test.js
      - name: Ursino source-reproduction gate
        run: node test/v15_ursino_1998_source_reproduction_gate.test.js
