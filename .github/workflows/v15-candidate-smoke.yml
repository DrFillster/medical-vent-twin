name: v1.5 Candidate Smoke

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-candidate-smoke.yml'

permissions:
  contents: read

jobs:
  candidate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gas-autonomic promotion parity
        run: node test/v15_gas_autonomic_candidate_promotion_parity.test.js
      - name: Gas-cardiovascular perturbation gate
        run: node test/v15_gas_cardiovascular_candidate.test.js
      - name: Ursino Fig9 sensitivity gate
        run: node test/v15_ursino_1998_fig9_sensitivity.test.js
      - name: Ursino source-reproduction gate
        run: node test/v15_ursino_1998_source_reproduction_gate.test.js
