name: v1.5 CDN Physician Browser Smoke

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-cdn-physician-browser-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ards-twin-v1.0/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Physician preview browser smoke
        env:
          BASE_URL: https://cdn.jsdelivr.net/gh/DrFillster/medical-vent-twin@420d20e203230d07acbe8aae3165abb491b0aa53/ards-twin-v1.5-preview/web/index.html
        run: node test/v15_cdn_physician_preview_smoke.cjs
