name: v1.5 Fig11 Beat Audit

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-fig11-beat-audit.yml'

permissions:
  contents: read

jobs:
  beat-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate beat-aligned Fig11 audit
        run: node scripts/ursino-magosso-2000-fig11-beat-aligned-audit.js
      - name: Upload beat-aligned audit
        uses: actions/upload-artifact@v4
        with:
          name: fig11-beat-audit
          path: ards-twin-v1.0/physician-audit-results/ursino-magosso-2000-fig11-beat-aligned-audit.json
