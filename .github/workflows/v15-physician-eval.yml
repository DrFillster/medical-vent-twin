name: v1.5 Physician Evaluation Gate

on:
  push:
    branches: [v1.5]
    paths:
      - 'ards-twin-v1.0/**'
      - '.github/workflows/v15-physician-eval.yml'
  workflow_dispatch:

concurrency:
  group: v15-physician-eval
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: npm run build

      - name: Unit and regression tests
        env:
          SKIP_MAC_WINE_QUALIFICATION: '1'
        run: npm test

      - name: Verify deployable web
        run: npm run verify:deploy

      - name: Physician baseline audit
        run: node scripts/physician-baseline-audit.js

      - name: Upload baseline audit
        uses: actions/upload-artifact@v4
        with:
          name: v15-physician-baseline-audit
          path: ards-twin-v1.0/physician-audit-results/
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated physician preview
        uses: actions/upload-artifact@v4
        with:
          name: v15-physician-static-web
          path: ards-twin-v1.0/web/
          if-no-files-found: error
          retention-days: 7
