name: v1.5 Physician Evaluation Gate

# Manual-only. The v1.5 branch changes frequently during evidence-first
# physiology work; automatic push validation consumed Actions on every
# research commit. Run this gate only at deliberate physician-review
# checkpoints.
on:
  workflow_dispatch:

concurrency:
  group: v15-physician-eval
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: npm run build

      - name: Unit and regression tests
        env:
          SKIP_MAC_WINE_QUALIFICATION: '1'
        run: npm test

      - name: Verify deployable web
        run: npm run verify:deploy

      - name: Primary-source closed-loop cardiovascular challenge
        run: node scripts/ursino-1998-closed-loop-challenge.js

      - name: Upload candidate physiology audit
        uses: actions/upload-artifact@v4
        with:
          name: v15-candidate-physiology-audit
          path: ards-twin-v1.0/physician-audit-results/ursino-1998-closed-loop-challenge.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated physician preview
        uses: actions/upload-artifact@v4
        with:
          name: v15-physician-static-web
          path: ards-twin-v1.0/web/
          if-no-files-found: error
          retention-days: 7
