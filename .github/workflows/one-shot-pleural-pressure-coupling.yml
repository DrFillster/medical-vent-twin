name: One-shot Pleural Pressure Coupling

on:
  push:
    branches:
      - probe/hummod-core-native-e2e-20260924
    paths:
      - .run-pleural-pressure-coupling

permissions:
  contents: read

jobs:
  pleural-pressure:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned upstream HumMod
        uses: actions/checkout@v4
        with:
          repository: riliescu/hummod-standalone
          ref: 8dab57e05631f779bf5020fe0dd51874d8ae98c1
          path: hummod-standalone

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run pleural pressure coupling probe
        run: node hummod-core-probe/pleural-pressure-probe.js hummod-standalone runtime/pleural-pressure-coupling

      - name: Upload pleural pressure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleural-pressure-coupling
          path: runtime/pleural-pressure-coupling/
          if-no-files-found: warn
