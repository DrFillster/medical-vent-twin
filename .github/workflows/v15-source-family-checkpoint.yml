name: v1.5 source-family autonomic checkpoint

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-source-family-checkpoint.yml'
      - 'ards-twin-v1.0/src/ursino_magosso_autonomic_shadow.js'
      - 'ards-twin-v1.0/src/magosso_ursino_2001_gas_autonomic_candidate.js'
      - 'ards-twin-v1.0/src/magosso_ursino_venous_shadow_contract.js'
      - 'ards-twin-v1.0/src/ursino_magosso_channelized_effectors_candidate.js'
      - 'ards-twin-v1.0/src/ursino_magosso_gas_cardiovascular_shadow.js'
      - 'ards-twin-v1.0/test/ursino_magosso_autonomic_shadow.test.js'
      - 'ards-twin-v1.0/test/v15_magosso_ursino_2001_gas_autonomic_candidate.test.js'
      - 'ards-twin-v1.0/test/magosso_ursino_venous_shadow_contract.test.js'
      - 'ards-twin-v1.0/test/v15_ursino_magosso_channelized_effectors_candidate.test.js'
      - 'ards-twin-v1.0/test/v15_ursino_magosso_gas_cardiovascular_shadow.test.js'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-family autonomic checkpoint
        run: |
          node test/ursino_magosso_autonomic_shadow.test.js
          node test/v15_magosso_ursino_2001_gas_autonomic_candidate.test.js
          node test/magosso_ursino_venous_shadow_contract.test.js
          node test/v15_ursino_magosso_channelized_effectors_candidate.test.js
          node test/v15_ursino_magosso_gas_cardiovascular_shadow.test.js
