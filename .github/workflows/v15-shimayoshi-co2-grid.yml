name: v1.5 Shimayoshi CO2 Source Grid

on:
  workflow_dispatch:

concurrency:
  group: v15-shimayoshi-co2-grid
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  co2-grid:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Vent v1.5
        uses: actions/checkout@v4

      - name: Checkout pinned Shimayoshi source
        uses: actions/checkout@v4
        with:
          repository: atakeuti/TS-AT-SM-2026-IRmodel
          ref: 6478d2ab0acbfc88d3da461d2594658bcb2798ca
          path: shimayoshi-upstream
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build source control extractor
        shell: pwsh
        run: |
          node ards-twin-v1.0/scripts/patch-shimayoshi-source-grid.js shimayoshi-upstream control
          git -C shimayoshi-upstream diff -- simulator/main.cpp simulator/model.cpp | Out-File -Encoding utf8 SHIMAYOSHI_GRID_CONTROL_DIFF.patch
          msbuild shimayoshi-upstream/VCM-CVODE.sln /m /p:Configuration=Debug /p:Platform=x64

      - name: Run source control reference
        shell: pwsh
        working-directory: shimayoshi-upstream/simulator
        run: |
          $exe = Resolve-Path ../x64/Debug/simulator.exe
          & $exe 0.8 shimayoshi_grid_control.csv control 0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore and build acidosis grid extractor
        shell: pwsh
        run: |
          git -C shimayoshi-upstream checkout -- simulator/main.cpp simulator/model.cpp
          node ards-twin-v1.0/scripts/patch-shimayoshi-source-grid.js shimayoshi-upstream acidosis
          git -C shimayoshi-upstream diff -- simulator/main.cpp simulator/model.cpp | Out-File -Encoding utf8 SHIMAYOSHI_GRID_ACIDOSIS_DIFF.patch
          msbuild shimayoshi-upstream/VCM-CVODE.sln /m /p:Configuration=Debug /p:Platform=x64

      - name: Run source CO2 challenge grid
        shell: pwsh
        working-directory: shimayoshi-upstream/simulator
        run: |
          $exe = Resolve-Path ../x64/Debug/simulator.exe
          foreach ($co2 in @(10,15,20,25,30)) {
            $tag = [string]$co2
            & $exe 960.0 "shimayoshi_acidosis_co2_$tag.csv" acidosis 0.2 $co2
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build and validate source manifests
        shell: pwsh
        run: |
          $controlDiff = Get-Content SHIMAYOSHI_GRID_CONTROL_DIFF.patch -Raw
          $acidDiff = Get-Content SHIMAYOSHI_GRID_ACIDOSIS_DIFF.patch -Raw
          $control = [ordered]@{
            upstreamGitSha = '6478d2ab0acbfc88d3da461d2594658bcb2798ca'
            compilerBuildEnvironment = 'GitHub Actions windows-latest; Visual Studio MSBuild; Debug x64'
            exactCodeDiff = $controlDiff
            simulationDuration = '0.8 s source-model control reference'
            protocolEnabled = 'control; ischemia disabled; respiratory acidosis disabled'
            outputCadence = 'one row per 400 ms paced cycle'
            cvodeTargetCadenceMs = 0.1
            protocolName = 'control'
            physiologyChanged = $false
          }
          $control | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 SHIMAYOSHI_GRID_CONTROL_SOURCE_RUN.json

          foreach ($co2 in @(10,15,20,25,30)) {
            $manifest = [ordered]@{
              upstreamGitSha = '6478d2ab0acbfc88d3da461d2594658bcb2798ca'
              compilerBuildEnvironment = 'GitHub Actions windows-latest; Visual Studio MSBuild; Debug x64'
              exactCodeDiff = $acidDiff
              simulationDuration = '960 s: 300 s control + 600 s respiratory acidosis + 60 s recovery'
              protocolEnabled = "source respiratory acidosis enabled; challenge CO2o_p2=$co2%"
              outputCadence = 'one row per 400 ms paced cycle'
              cvodeTargetCadenceMs = 0.2
              protocolName = 'acidosis'
              sourceChallengeCo2Percent = $co2
              physiologyChanged = $false
            }
            $manifestPath = "SHIMAYOSHI_ACIDOSIS_CO2_${co2}_SOURCE_RUN.json"
            $manifest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 $manifestPath
            node ards-twin-v1.0/scripts/import-shimayoshi-source-run.js shimayoshi-upstream/simulator/shimayoshi_grid_control.csv SHIMAYOSHI_GRID_CONTROL_SOURCE_RUN.json "shimayoshi-upstream/simulator/shimayoshi_acidosis_co2_$co2.csv" $manifestPath "shimayoshi_acidosis_co2_${co2}_import.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Summarize source grid
        shell: pwsh
        run: |
          foreach ($co2 in @(10,15,20,25,30)) {
            node ards-twin-v1.0/scripts/summarize-shimayoshi-source-run.js "shimayoshi_acidosis_co2_${co2}_import.json" "shimayoshi_acidosis_co2_${co2}_summary.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node -e "for (const c of [10,15,20,25,30]) { const x=require('./shimayoshi_acidosis_co2_'+c+'_summary.json'); const a=x.phaseSummaries.acidosis; console.log({co2Percent:c,meanFb:a.meanPeakFbMnPerMm2,meanRatio:a.meanStressRatio,minFb:a.minPeakFb.peak_Fb_mN_per_mm2,minRatio:a.minPeakFb.stress_ratio,minFbTimeS:a.minPeakFb.time_s,minPHi:a.minPHi.pHi,minPHiTimeS:a.minPHi.time_s}); }"

      - name: Upload source grid artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v15-shimayoshi-co2-source-grid
          path: |
            shimayoshi-upstream/simulator/shimayoshi_grid_control.csv
            shimayoshi-upstream/simulator/shimayoshi_acidosis_co2_*.csv
            SHIMAYOSHI_GRID_CONTROL_SOURCE_RUN.json
            SHIMAYOSHI_ACIDOSIS_CO2_*_SOURCE_RUN.json
            SHIMAYOSHI_GRID_CONTROL_DIFF.patch
            SHIMAYOSHI_GRID_ACIDOSIS_DIFF.patch
            shimayoshi_acidosis_co2_*_import.json
            shimayoshi_acidosis_co2_*_summary.json
          if-no-files-found: warn
          retention-days: 14
