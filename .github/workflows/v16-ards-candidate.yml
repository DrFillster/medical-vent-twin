name: v1.6 ARDS Candidate

on:
  push:
    branches: [v1.6]
    paths:
      - '.github/workflows/v16-ards-candidate.yml'
      - 'ards-twin-v1.0/src/hummod_ards_core_runtime.js'
      - 'ards-twin-v1.0/src/v16_ards_pulmonary_gas_candidate.js'
      - 'ards-twin-v1.0/test/v16_ards_pulmonary_gas_candidate.test.js'
      - 'ards-twin-v1.0/src/karamolegkos_pulmonary_circulation_candidate.js'
      - 'ards-twin-v1.0/test/v15_karamolegkos_pulmonary_circulation_candidate.test.js'
      - 'ards-twin-v1.0/src/v16_albanese_karamolegkos_pulmonary_coordinate_runtime.js'
      - 'ards-twin-v1.0/test/v16_albanese_karamolegkos_pulmonary_coordinate_runtime.test.js'
      - 'ards-twin-v1.0/src/v16_karamolegkos_pulmonary_vascular_runtime.js'
      - 'ards-twin-v1.0/test/v16_karamolegkos_pulmonary_vascular_runtime.test.js'
      - 'ards-twin-v1.0/src/v16_das_ards_regional_perfusion_candidate.js'
      - 'ards-twin-v1.0/test/v16_das_ards_regional_perfusion_candidate.test.js'
      - 'ards-twin-v1.0/src/v16_marshall_hpv_candidate.js'
      - 'ards-twin-v1.0/test/v16_marshall_hpv_candidate.test.js'
      - 'ards-twin-v1.0/src/v16_das_marshall_regional_hpv_perfusion.js'
      - 'ards-twin-v1.0/test/v16_das_marshall_regional_hpv_perfusion.test.js'
      - 'ards-twin-v1.0/src/v16_regional_ards_o2_perfusion_candidate.js'
      - 'ards-twin-v1.0/test/v16_regional_ards_o2_perfusion_candidate.test.js'
      - 'ards-twin-v1.0/src/v16_vent_regional_alveolar_ventilation_adapter.js'
      - 'ards-twin-v1.0/test/v16_vent_regional_alveolar_ventilation_adapter.test.js'
      - 'ards-twin-v1.0/src/v16_vent_regional_ards_oxygen_bridge.js'
      - 'ards-twin-v1.0/test/v16_vent_regional_ards_oxygen_bridge.test.js'
      - 'ards-twin-v1.0/src/v16_reference_anchored_alveolar_volume_adapter.js'
      - 'ards-twin-v1.0/test/v16_reference_anchored_alveolar_volume_adapter.test.js'
      - 'ards-twin-v1.0/src/v16_vent_karamolegkos_pressure_coordinate_adapter.js'
      - 'ards-twin-v1.0/test/v16_vent_karamolegkos_pressure_coordinate_adapter.test.js'
      - 'ards-twin-v1.0/test/v16_reference_anchored_alveolar_volume_adapter.test.js'
      - 'ards-twin-v1.0/src/v16_integrated_ards_cardiopulmonary_candidate.js'
      - 'ards-twin-v1.0/src/v16_physician_ards_candidate.js'
      - 'ards-twin-v1.0/test/v16_physician_ards_candidate.test.js'
      - 'ards-twin-v1.0/test/v16_integrated_ards_cardiopulmonary_candidate.test.js'

permissions:
  contents: read

jobs:
  focused-ards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: v1.6 ARDS pulmonary gas candidate
        run: node test/v16_ards_pulmonary_gas_candidate.test.js
      - name: Karamolegkos source equations including Appendix A25
        run: node test/v15_karamolegkos_pulmonary_circulation_candidate.test.js
      - name: Albanese-Karamolegkos pulmonary coordinate runtime
        run: node test/v16_albanese_karamolegkos_pulmonary_coordinate_runtime.test.js
      - name: v1.6 Karamolegkos pulmonary vascular runtime
        run: node test/v16_karamolegkos_pulmonary_vascular_runtime.test.js
      - name: Das human-ARDS regional perfusion equations
        run: node test/v16_das_ards_regional_perfusion_candidate.test.js
      - name: Marshall HPV candidate
        run: node test/v16_marshall_hpv_candidate.test.js
      - name: Das-Marshall regional HPV perfusion
        run: node test/v16_das_marshall_regional_hpv_perfusion.test.js
      - name: Regional ARDS O2-perfusion fixed point
        run: node test/v16_regional_ards_o2_perfusion_candidate.test.js
      - name: Vent regional alveolar ventilation adapter
        run: node test/v16_vent_regional_alveolar_ventilation_adapter.test.js
      - name: Vent regional ARDS oxygen bridge
        run: node test/v16_vent_regional_ards_oxygen_bridge.test.js
      - name: Reference-anchored absolute alveolar volume
        run: node test/v16_reference_anchored_alveolar_volume_adapter.test.js
      - name: Passive Vent-Karamolegkos pressure coordinate
        run: node test/v16_vent_karamolegkos_pressure_coordinate_adapter.test.js
      - name: v1.6 integrated ARDS cardiopulmonary candidate
        run: node test/v16_integrated_ards_cardiopulmonary_candidate.test.js
      - name: v1.6 persistent physician ARDS candidate
        run: node test/v16_physician_ards_candidate.test.js
