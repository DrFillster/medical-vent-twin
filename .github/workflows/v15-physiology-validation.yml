name: v1.5 Physiology Validation
# regression revision 2: corrected Shimayoshi fixtures and HumMod myocardial SID units
# one-shot validation after dynamic acidosis + ischemia mechanics checkpoint

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/v15-validation-trigger'
  workflow_dispatch:

concurrency:
  group: v15-physiology-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - name: Checkout v1.5
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ards-twin-v1.0/package-lock.json

      - name: Install
        run: npm ci

      - name: Full Node regression suite
        run: npm test

      - name: Verify deployable static web
        run: npm run verify:deploy
