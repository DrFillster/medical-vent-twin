name: v1.5 Oxygen Metabolic Audit
# unit-bridge verification 2

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-oxygen-metabolic-audit.yml'

permissions:
  contents: read

jobs:
  oxygen-metabolic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Oxygen metabolic source primitives
        run: node test/v15_ursino_magosso_2000_oxygen_metabolic_candidate.test.js
