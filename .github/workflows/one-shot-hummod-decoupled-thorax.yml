name: One-shot HumMod Decoupled Thorax Bridge

on:
  push:
    branches:
      - probe/hummod-core-native-e2e-20260924
    paths:
      - .run-hummod-decoupled-thorax

permissions:
  contents: read

jobs:
  decoupled-thorax:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned upstream HumMod
        uses: actions/checkout@v4
        with:
          repository: riliescu/hummod-standalone
          ref: 8dab57e05631f779bf5020fe0dd51874d8ae98c1
          path: hummod-standalone

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch working copy with decoupled thorax bridge
        run: node hummod-core-probe/patch-hummod-thorax-bridge.js hummod-standalone 8dab57e05631f779bf5020fe0dd51874d8ae98c1

      - name: Validate decoupled native thorax bridge
        run: node hummod-core-probe/decoupled-thorax-validation.js hummod-standalone runtime/decoupled-thorax

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummod-decoupled-thorax
          path: runtime/decoupled-thorax/
          if-no-files-found: error
