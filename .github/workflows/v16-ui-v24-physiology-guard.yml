name: v1.6 UI + v2.4 physiology guard

on:
  push:
    branches:
      - integration/v16-ui-v24-physiology
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Immutable references; validates the served bundle and frozen worker.
      # This workflow has no deployment job or repository write permission.
      - name: Verify frozen UI, physiology provenance and runtime contract
        run: node ards-twin-v0.5-progress/scripts/verify-integration.cjs
