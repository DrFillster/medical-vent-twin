name: v1.6 UI + v2.4 physiology guard

on:
  push:
    branches:
      - integration/v16-ui-v24-physiology
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch frozen UI reference
        run: git fetch origin v1.6 v2.4
      - name: Verify frozen v1.6 UI
        run: |
          set -eu
          for f in             ards-twin-v1.0/web/index.html             ards-twin-v1.0/web/app.js             ards-twin-v1.0/web/styles.css             ards-twin-v1.0/web/clinical-worker.js             ards-twin-v1.0/web/native-engine-client.js             ards-twin-v1.0/web/native-engine-config.js
          do
            cmp "$f" <(git show origin/v1.6:"$f")
          done
      - name: Verify v2.4 physiology engine baseline
        run: cmp ards-twin-v1.0/web/engine.js <(git show origin/v2.4:ards-twin-v1.0/web/engine.js)
      - name: Verify protected production site is not targeted
        run: |
          if grep -R "vent.defying-logic.com" -n .github ards-twin-v1.0 2>/dev/null; then
            echo "Protected production hostname referenced by integration branch."
            exit 1
          fi
