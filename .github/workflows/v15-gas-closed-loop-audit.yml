name: v1.5 Gas Closed-Loop Audit

on:
  push:
    branches: [v1.5]
    paths:
      - '.run-v15-gasloop'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Closed-loop boundary test
        run: node test/v15_ursino_magosso_gas_closed_loop.test.js

      - name: Ursino Fig9 sensitivity regression
        run: node test/v15_ursino_1998_fig9_sensitivity.test.js

      - name: Gas-autonomic closed-loop challenge
        run: node scripts/ursino-magosso-gas-closed-loop-challenge.js

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: v15-gas-closed-loop-audit
          path: ards-twin-v1.0/physician-audit-results/ursino-magosso-gas-closed-loop.json
          if-no-files-found: error
          retention-days: 7
