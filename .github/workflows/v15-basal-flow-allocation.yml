name: v1.5 Basal Flow Allocation

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-basal-flow-allocation.yml'

permissions:
  contents: read

jobs:
  basal-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate basal flow allocation audit
        run: node scripts/ursino-magosso-2000-basal-flow-allocation-audit.js
      - name: Basal flow allocation assertions
        run: node test/v15_ursino_magosso_2000_basal_flow_allocation.test.js
      - name: Upload basal flow allocation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basal-flow-allocation
          path: ards-twin-v1.0/physician-audit-results/ursino-magosso-2000-basal-flow-allocation-audit.json
