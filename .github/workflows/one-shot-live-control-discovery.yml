name: One-shot HumMod Live Control Discovery

on:
  push:
    branches:
      - probe/hummod-core-native-e2e-20260924
    paths:
      - .run-live-control-discovery

permissions:
  contents: read

jobs:
  discover-controls:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned upstream HumMod
        uses: actions/checkout@v4
        with:
          repository: riliescu/hummod-standalone
          ref: 8dab57e05631f779bf5020fe0dd51874d8ae98c1
          path: hummod-standalone

      - name: Discover live HumMod controls
        shell: powershell
        run: |
          ./hummod-core-probe/discover-live-controls.ps1 `
            -HumModRoot ./hummod-standalone `
            -OutputDirectory ./runtime/live-control-discovery

      - name: Upload discovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummod-live-control-discovery
          path: runtime/live-control-discovery/
          if-no-files-found: warn
