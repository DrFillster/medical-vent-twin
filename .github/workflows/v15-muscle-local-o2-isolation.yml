name: v1.5 Muscle Local O2 Isolation

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-muscle-local-o2-isolation.yml'

permissions:
  contents: read

jobs:
  muscle-local-o2:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate muscle local O2 isolation
        run: node scripts/ursino-magosso-2000-muscle-local-o2-isolation.js
      - name: Muscle local O2 isolation assertions
        run: node test/v15_ursino_magosso_2000_muscle_local_o2_isolation.test.js
      - name: Upload muscle local O2 isolation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muscle-local-o2-isolation
          path: ards-twin-v1.0/physician-audit-results/ursino-magosso-2000-muscle-local-o2-isolation.json
