name: v1.6 Myocardial pHi Provider

on:
  push:
    branches: [v1.6]
    paths:
      - '.github/workflows/v16-myocardial-phi-provider.yml'
      - 'ards-twin-v1.0/src/hummod_2013_live_myocardial_acid_base_provider.js'
      - 'ards-twin-v1.0/test/v16_live_myocardial_acid_base_provider.test.js'
      - 'ards-twin-v1.0/src/v16_myocardial_live_input_adapter.js'
      - 'ards-twin-v1.0/test/v16_myocardial_live_input_adapter.test.js'
      - 'ards-twin-v1.0/src/v15_integrated_cardiopulmonary_candidate.js'
      - 'ards-twin-v1.0/test/v16_integrated_myocardial_source_state.test.js'
      - 'ards-twin-v1.0/src/hummod_2013_kcell_runtime.js'
      - 'ards-twin-v1.0/test/v16_hummod_2013_kcell_runtime.test.js'
      - 'ards-twin-v1.0/src/hummod_2013_systemic_lactate_pool_runtime.js'
      - 'ards-twin-v1.0/test/v16_hummod_2013_systemic_lactate_pool_runtime.test.js'
      - 'ards-twin-v1.0/src/hummod_2013_left_heart_liquid_volume_runtime.js'
      - 'ards-twin-v1.0/test/v16_hummod_2013_left_heart_liquid_volume_runtime.test.js'
      - 'ards-twin-v1.0/src/v16_myocardial_upstream_runtime.js'
      - 'ards-twin-v1.0/test/v16_myocardial_upstream_runtime.test.js'
      - 'ards-twin-v1.0/src/v16_left_heart_fuel_live_bridge.js'
      - 'ards-twin-v1.0/test/v16_left_heart_fuel_live_bridge.test.js'

permissions:
  contents: read

jobs:
  focused-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Nine-input myocardial acid-base provider
        run: node test/v16_live_myocardial_acid_base_provider.test.js
      - name: Live myocardial chemistry adapter
        run: node test/v16_myocardial_live_input_adapter.test.js
      - name: Integrated myocardial source outputs
        run: node test/v16_integrated_myocardial_source_state.test.js
      - name: Persistent HumMod 2013 KCell runtime
        run: node test/v16_hummod_2013_kcell_runtime.test.js
      - name: Persistent HumMod 2013 systemic lactate pool
        run: node test/v16_hummod_2013_systemic_lactate_pool_runtime.test.js
      - name: Live HumMod 2013 left-heart liquid volume
        run: node test/v16_hummod_2013_left_heart_liquid_volume_runtime.test.js
      - name: Myocardial upstream composition runtime
        run: node test/v16_myocardial_upstream_runtime.test.js
      - name: Live HumMod 2013 LeftHeart-Fuel bridge
        run: node test/v16_left_heart_fuel_live_bridge.test.js
