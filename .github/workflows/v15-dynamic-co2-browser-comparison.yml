name: v1.5 Dynamic CO2 Browser Comparison

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-dynamic-co2-browser-comparison.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current v1.5
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download validated dynamic source artifact
        uses: actions/download-artifact@v4
        with:
          name: v15-shimayoshi-dynamic-co2-validation
          path: source-artifact
          repository: DrFillster/medical-vent-twin
          run-id: 38166194835
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare source against browser compressed grid
        run: |
          node ards-twin-v1.0/scripts/compare-shimayoshi-dynamic-grid.js source-artifact/SHIMAYOSHI_DYNAMIC_CO2_VALIDATED.json SHIMAYOSHI_DYNAMIC_BROWSER_COMPARISON.json
          cat SHIMAYOSHI_DYNAMIC_BROWSER_COMPARISON.json

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: v15-shimayoshi-dynamic-browser-comparison
          path: SHIMAYOSHI_DYNAMIC_BROWSER_COMPARISON.json
          retention-days: 14
