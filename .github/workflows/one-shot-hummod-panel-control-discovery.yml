name: One-shot HumMod Panel Control Discovery

on:
  push:
    branches:
      - probe/hummod-core-native-e2e-20260924
    paths:
      - .run-hummod-panel-control-discovery

permissions:
  contents: read

jobs:
  discover:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned upstream HumMod
        uses: actions/checkout@v4
        with:
          repository: riliescu/hummod-standalone
          ref: 8dab57e05631f779bf5020fe0dd51874d8ae98c1
          path: hummod-standalone

      - name: Discover HumMod panel controls
        shell: pwsh
        run: |
          ./hummod-core-probe/discover-panel-controls.ps1 `
            -HumModRoot ./hummod-standalone `
            -OutputDirectory ./runtime/panel-control-discovery

      - name: Upload discovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummod-panel-control-discovery
          path: runtime/panel-control-discovery/
          if-no-files-found: error
