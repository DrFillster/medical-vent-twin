name: v1.5 Basal Local O2 Fixed Point

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-basal-local-o2-fixed-point.yml'

permissions:
  contents: read

jobs:
  basal-local-o2:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate basal local O2 fixed-point audit
        run: node scripts/ursino-magosso-2000-basal-local-o2-fixed-point.js
      - name: Basal local O2 fixed-point assertions
        run: node test/v15_ursino_magosso_2000_basal_local_o2_fixed_point.test.js
      - name: Upload basal local O2 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basal-local-o2-fixed-point
          path: ards-twin-v1.0/physician-audit-results/ursino-magosso-2000-basal-local-o2-fixed-point.json
