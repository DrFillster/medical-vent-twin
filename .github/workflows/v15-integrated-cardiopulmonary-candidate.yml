name: v1.5 Integrated Cardiopulmonary Candidate

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-integrated-cardiopulmonary-candidate.yml'
      - 'ards-twin-v1.0/src/v15_integrated_cardiopulmonary_candidate.js'
      - 'ards-twin-v1.0/test/v15_integrated_cardiopulmonary_candidate.test.js'

permissions:
  contents: read

jobs:
  focused-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrated cardiopulmonary candidate gate
        run: node test/v15_integrated_cardiopulmonary_candidate.test.js
