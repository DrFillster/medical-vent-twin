name: v1.5 Baseline Failure Comparison
# temporary validation; remove before merge

on:
  push:
    branches:
      - fix/v15-terminal-chronotropic-reserve-20261103
    paths:
      - '.github/workflows/v15-terminal-chronotropic-reserve-validation.yml'

permissions:
  contents: read

jobs:
  baseline-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ards-twin-v1.0/package-lock.json
      - name: Install
        run: npm ci
      - name: Build baseline browser engine
        run: npm run build
      - name: Baseline gas external validation
        continue-on-error: true
        run: node test/v15_gas_external_validation_matrix.test.js
      - name: Baseline human autonomic smoke
        continue-on-error: true
        run: node test/v15_human_autonomic_validation_smoke.test.js
      - name: Baseline myocardial observer
        continue-on-error: true
        run: node test/v15_hummod_myocardial_decompensation_observer.test.js
      - name: Baseline integrated cardiopulmonary candidate
        continue-on-error: true
        run: node test/v15_integrated_cardiopulmonary_candidate.test.js
      - name: Baseline physician browser contract
        continue-on-error: true
        run: node test/v15_physician_candidate_browser_contract.test.js
      - name: Baseline physician myocardial UI
        continue-on-error: true
        run: node test/v15_physician_myocardial_status_ui.test.js
      - name: Baseline basal flow allocation
        continue-on-error: true
        run: node test/v15_ursino_magosso_2000_basal_flow_allocation.test.js
      - name: Baseline basal local O2 fixed point
        continue-on-error: true
        run: node test/v15_ursino_magosso_2000_basal_local_o2_fixed_point.test.js
