name: v1.5 Effector Delay Diagnostic

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-effector-delay-diagnostic.yml'

permissions:
  contents: read

jobs:
  delay-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate delay audit
        run: node scripts/ursino-magosso-2000-effector-delay-audit.js
      - name: Upload delay audit
        uses: actions/upload-artifact@v4
        with:
          name: effector-delay-audit
          path: ards-twin-v1.0/physician-audit-results/ursino-magosso-2000-effector-delay-audit.json
