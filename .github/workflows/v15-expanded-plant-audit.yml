name: v1.5 Expanded Plant Audit
# delay prehistory verified

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-expanded-plant-audit.yml'

permissions:
  contents: read

jobs:
  expanded-plant-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expanded cardiovascular plant
        run: node test/v15_ursino_magosso_2000_expanded_plant_runtime.test.js
      - name: Split systemic effectors
        run: node test/v15_ursino_magosso_2000_split_effectors_runtime.test.js
      - name: Expanded reflex candidate
        run: node test/v15_ursino_magosso_2000_expanded_reflex_candidate.test.js
