name: v1.5 Sync Gate Validation

on:
  push:
    branches:
      - fix/v15-sync-gate-current-artifact-20261103

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deployment branch contract
        run: node ards-twin-v1.0/test/v15_deploy_branch_contract.test.js
      - name: Validate sync script syntax
        run: bash -n .deploy/preview-sync-main.sh
      - name: Validate tracked artifact contract directly
        run: |
          grep -q 'id="clinical-extremis-validation"' ards-twin-v1.0/web/index.html
          grep -q 'Generated by npm run build. Version 1.5.0.' ards-twin-v1.0/web/engine.js
          grep -q 'chronotropicReserveMultiplier' ards-twin-v1.0/web/engine.js
          grep -q 'effectiveHeartRatePerMin' ards-twin-v1.0/web/engine.js
          grep -q 'cardiacArrest' ards-twin-v1.0/web/engine.js
