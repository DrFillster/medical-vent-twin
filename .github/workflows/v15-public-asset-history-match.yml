name: v1.5 Public Asset History Match

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-public-asset-history-match.yml'

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch public assets
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/public
          for asset in index.html app.js clinical-worker.js engine.js; do
            curl -L -sS --fail --max-time 20 "https://hummod.defying-logic.com/$asset" -o "/tmp/public/$asset"
          done
      - name: Find matching historical commits
        shell: bash
        run: |
          set -e
          git log -n 150 --format='%H' v1.5 > /tmp/commits
          for asset in index.html app.js clinical-worker.js engine.js; do
            path="ards-twin-v1.0/web/$asset"
            echo "== $asset =="
            found=0
            while read sha; do
              if git cat-file -e "$sha:$path" 2>/dev/null; then
                git show "$sha:$path" > /tmp/candidate
                if cmp -s /tmp/public/$asset /tmp/candidate; then
                  echo "MATCH $sha $(git show -s --format='%cI %s' $sha)"
                  found=1
                  break
                fi
              fi
            done < /tmp/commits
            if [ "$found" = "0" ]; then
              echo "NO_MATCH_IN_LAST_150"
            fi
          done
