name: v1.5 Hennigs Respiratory Audit

on:
  push:
    branches: [v1.5]
    paths:
      - '.run-v15-hennigs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hennigs primitives
        run: node test/v15_hennigs_respiratory_primitives.test.js

      - name: Hennigs oscillator topology
        run: node test/v15_hennigs_neural_oscillator.test.js

      - name: Hennigs oscillator runtime
        run: node test/v15_hennigs_neural_oscillator_runtime.test.js

      - name: Lista-Paz source equations
        run: node test/v15_lista_paz_respiratory_pressure.test.js

      - name: Hennigs oscillator rate challenge
        run: node scripts/hennigs-neural-oscillator-source-reproduction.js

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: v15-hennigs-oscillator-audit
          path: ards-twin-v1.0/physician-audit-results/hennigs-neural-oscillator-source-reproduction.json
          if-no-files-found: error
          retention-days: 7
