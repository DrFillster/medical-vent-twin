name: v1.5 Split Effector Audit

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-split-effector-audit.yml'

permissions:
  contents: read

jobs:
  split-effector-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Split effector source equivalence
        run: node test/v15_ursino_magosso_2000_split_effectors_candidate.test.js
