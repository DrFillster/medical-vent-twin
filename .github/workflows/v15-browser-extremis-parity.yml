name: v1.5 Browser Extremis Parity

on:
  push:
    branches:
      - v1.5
    paths:
      - 'ards-twin-v1.0/src/**'
      - 'ards-twin-v1.0/web/**'
      - 'ards-twin-v1.0/test/v13_extremis_chronotropy.test.js'
      - 'ards-twin-v1.0/test/browser-extremis-parity.cjs'
      - 'ards-twin-v1.0/scripts/verify-deployable-web.js'
      - '.github/workflows/v15-browser-extremis-parity.yml'
  pull_request:
    branches:
      - v1.5
    paths:
      - 'ards-twin-v1.0/src/**'
      - 'ards-twin-v1.0/web/**'
      - 'ards-twin-v1.0/test/v13_extremis_chronotropy.test.js'
      - 'ards-twin-v1.0/test/browser-extremis-parity.cjs'
      - 'ards-twin-v1.0/scripts/verify-deployable-web.js'
      - '.github/workflows/v15-browser-extremis-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ards-twin-v1.0/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build browser engine
        run: npm run build
      - name: Verify deployable web wiring
        run: npm run verify:deploy
      - name: Focused extremis harness
        run: node test/v13_extremis_chronotropy.test.js
      - name: Manual ventilation and current hold measurements
        run: |
          node test/bedside_measurements.test.js
          node test/manual_low_peep_chemoreflex.test.js
          node test/browser-manual-holds.cjs
      - name: Browser worker extremis parity
        run: node test/browser-extremis-parity.cjs
