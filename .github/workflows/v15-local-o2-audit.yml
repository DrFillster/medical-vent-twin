name: v1.5 Local O2 Audit

on:
  push:
    branches: [v1.5]
    paths:
      - '.github/workflows/v15-local-o2-audit.yml'

permissions:
  contents: read

jobs:
  local-o2-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: ards-twin-v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local O2 vascular source equations
        run: node test/v15_ursino_magosso_2000_local_o2_candidate.test.js
